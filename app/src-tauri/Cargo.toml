[package]
name = "glass-app"
version = "0.1.0"
edition = "2021"
description = "Glass desktop app"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tokio = { version = "1.53.2", features = ["sync", "time", "macros"] }
