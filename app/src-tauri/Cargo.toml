[package]
name = "glass-app"
version = "0.2.0"
edition = "2021"
description = "Glass desktop app"
license = "Apache-2.0"

[lib]
name = "glass_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1.53.2", features = ["full"] }
glass-core = { path = "../../crates/core" }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9.0"
keyring = { version = "3", features = ["apple-native"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
