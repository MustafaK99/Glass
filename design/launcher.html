<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1e3207}a:hover{color:#525252}
.sheet{--bg:#f8f6f0;--surface:#f1ede1;--ink:#1a1b1a;--muted:#525252;--faint:#56645b;--line:#1a1b1a14;--line-strong:#1a1b1a29;--accent:#dcef54;--sans:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.sheet,.sheet *{box-sizing:border-box}
.sheet button{font:inherit;color:inherit}
.i{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.i .dash{stroke-dasharray:.01 2.1}
.sheet :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.kbd{font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--faint);border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px}
.pill{--h:44px;--px:18px;display:inline-flex;align-items:center;padding:0;border:0;background:none;cursor:pointer;font:500 14px/20px var(--sans);letter-spacing:-.01em;border-radius:999px}
.pill .lbl{display:inline-flex;align-items:center;border-radius:999px;padding:calc((var(--h) - 20px)/2) calc(var(--h) + var(--px)) calc((var(--h) - 20px)/2) var(--px);transition:padding .3s ease-out;white-space:nowrap;background:var(--accent);color:var(--ink)}
.pill .ico{position:relative;display:grid;place-items:center;flex:none;width:var(--h);height:var(--h);margin-left:calc(var(--h) * -1);transition:margin .3s ease-out;color:var(--ink)}
.pill .dot{position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:999px;background:var(--ink);transition:all .3s ease-out}
.pill svg{position:relative;width:16px;height:16px;opacity:0;transition:opacity .2s ease-out}
.pill:hover .lbl,.pill:focus-visible .lbl{padding-right:var(--px)}
.pill:hover .ico,.pill:focus-visible .ico{margin-left:0}
.pill:hover .dot,.pill:focus-visible .dot{width:var(--h);height:var(--h);background:var(--accent)}
.pill:hover svg,.pill:focus-visible svg{opacity:1;transition-delay:.1s}
.row{background:none;transition:background-color .15s ease-out}
.row:hover,.row[aria-current="true"]{background:var(--surface)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pill *,.row{transition:none!important}.caret{animation:none!important}}
</style>
</head><body>

<div class="sheet" style="width: 880px; height: 660px; padding: 48px 80px; display: flex; align-items: flex-start; justify-content: center; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; letter-spacing: -0.01em">
<div role="dialog" aria-label="New agent" style="width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 24px; overflow: hidden; box-shadow: 0 24px 80px #1a1b1a1f">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 10px">
<span class="cap">New agent</span>
<span style="display: flex; gap: 4px"><span class="kbd">⌘K</span><span class="kbd">esc</span></span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 20px 16px; font-size: 20px; font-weight: 350; letter-spacing: -0.03em">
<span class="mono" style="font-size: 13px; background: var(--surface); border-radius: 999px; padding: 5px 12px">@stats-demo</span>
<span>Add a median function with tests</span>
<span class="mono" style="font-size: 13px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px">@</span>
<span class="caret" aria-hidden="true" style="width: 1.5px; height: 24px; background: var(--ink); animation: blink 1.1s steps(1) infinite"></span>
</div>
<div class="mono" style="display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--faint)">
<span>own checkout from origin/main</span><span>high</span><span>Beam-501B-A23B</span><span>manual</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; border-top: 1px solid var(--line)">
<span class="cap" style="padding: 4px 12px">Projects</span>
<button type="button" class="row" aria-current="true" style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border: 0; border-radius: 12px; cursor: pointer"><span style="font-size: 15px; letter-spacing: -0.02em">stats-demo</span><span class="mono" style="color: var(--faint)">3 agents · ~/Projects/stats-demo</span></button>
<button type="button" class="row" aria-current="false" style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border: 0; border-radius: 12px; cursor: pointer"><span style="font-size: 15px; letter-spacing: -0.02em">docs-site</span><span class="mono" style="color: var(--faint)">2 agents · ~/Projects/docs-site</span></button>
<button type="button" class="row" aria-current="false" style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border: 0; border-radius: 12px; cursor: pointer"><span style="font-size: 15px; letter-spacing: -0.02em">Open a folder</span><span class="mono" style="color: var(--faint)">any git repo</span></button>
<span class="cap" style="padding: 12px 12px 4px">Connections</span>
<button type="button" class="row" aria-current="false" style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border: 0; border-radius: 12px; cursor: pointer"><span style="font-size: 15px; letter-spacing: -0.02em">Linear</span><span class="mono" style="color: var(--faint)">from ~/.mirror/mcp</span></button>
<button type="button" class="row" aria-current="false" style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border: 0; border-radius: 12px; cursor: pointer"><span style="font-size: 15px; letter-spacing: -0.02em">Notion</span><span class="mono" style="color: var(--faint)">from ~/.mirror/mcp</span></button>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 18px; border-top: 1px solid var(--line)">
<span class="mono" style="color: var(--faint)">stats-demo already has agents, so this one gets its own checkout</span>
<button type="button" class="pill"><span class="lbl">Start agent</span><span class="ico" aria-hidden="true"><span class="dot"></span><svg class="i" viewBox="0 0 16 16"><path class="dash" d="M2 8h10.5"></path><path d="M9.5 4.5 13 8l-3.5 3.5"></path></svg></span></button>
</div>
</div>
</div>
</body></html>
